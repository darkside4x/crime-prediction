pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;
  sendfile on;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    # The API accepts an 8 MiB media payload; retain bounded multipart headroom
    # while staying below the API Gateway 10 MB request ceiling.
    client_max_body_size 9m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: https://ITSStreamingBR2.dotd.la.gov; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://ITSStreamingBR2.dotd.la.gov; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /v1/ {
      proxy_pass http://api:8000;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
      # Managed ingress replaces the viewer Host with an ALB origin host.
      # Normalize at this trusted same-host proxy so FastAPI receives a stable,
      # explicitly allowlisted internal host.
      proxy_set_header Host localhost;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
      proxy_pass http://api:8000;
      proxy_connect_timeout 3s;
      proxy_read_timeout 3s;
      proxy_set_header Host localhost;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ready {
      proxy_pass http://api:8000;
      proxy_connect_timeout 3s;
      proxy_read_timeout 3s;
      proxy_set_header Host localhost;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
