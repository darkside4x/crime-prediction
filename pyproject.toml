[project]
name = "crime-hotspot-prototype"
version = "0.1.0"
description = "Tenant-aware aggregate incident forecasting prototype"
requires-python = ">=3.12"
dependencies = [
  "h3==4.3.1",
  "jsonschema[format]==4.25.1",
  "polars==1.32.3",
]

[project.optional-dependencies]
api = [
  "fastapi==0.141.1",
  "openai==3.6.0",
  "PyJWT[crypto]==2.13.0",
  "python-dotenv==1.2.3",
  "python-multipart==0.0.31",
  "uvicorn==0.35.0",
]
model = [
  "lightgbm==4.6.0",
  "numpy==2.2.3",
  "pyarrow==23.0.1",
  "scikit-learn==1.6.1",
]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.3",
]
platform = [
  "boto3==1.40.31",
  "psycopg[binary,pool]==3.2.10",
  "twilio==9.11.0",
]

[project.scripts]
crime-data = "src.data.cli:main"
crime-model = "src.models.cli:main"
crime-api-openapi = "src.api.openapi:main"
crime-platform-migrate = "src.data.video.cli:migrate"
crime-video-worker = "src.data.video.cli:worker"
crime-video-capture-worker = "src.data.video.cli:capture_worker"
crime-demo-worker = "src.data.video.cli:demo_worker"
crime-dispatch-worker = "src.data.dispatch.cli:worker"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"contracts/schemas" = "src/data/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# FastAPI intentionally evaluates dependency/parameter marker factories in route defaults.
"src/api/app.py" = ["B008"]
