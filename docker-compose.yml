services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      REKA_BASE_URL: ${REKA_BASE_URL:-https://api.reka.ai/v1}
      REKA_API_KEY: ${REKA_API_KEY:-}
      REKA_MODEL: ${REKA_MODEL:-reka-flash}
      REKA_PROMPT_VERSION: ${REKA_PROMPT_VERSION:-1.0.0}
      REKA_TIMEOUT_SECONDS: ${REKA_TIMEOUT_SECONDS:-20}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./src/web
      dockerfile: ../../docker/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
