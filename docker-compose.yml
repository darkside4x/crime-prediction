services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: crime_prediction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-postgres-admin-only
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crime_prediction"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["python", "-c", "from src.data.video.cli import migrate; migrate()"]
    environment:
      DATABASE_URL: postgresql://crime_app:local-development-only@postgres:5432/crime_prediction
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      DATABASE_URL: postgresql://crime_app:local-development-only@postgres:5432/crime_prediction
      REKA_API_KEY: ${REKA_API_KEY:-}
      RUNTIME_DIR: /app/data/runtime
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - api-runtime:/app/data/runtime
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres-data:
  api-runtime:
