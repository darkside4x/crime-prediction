name: Security and deployability

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked direct dependencies and scanners
        run: >-
          python -m pip install -e ".[api,model,platform]"
          "bandit==1.8.6" "pip-audit==2.9.0"
      - name: Audit installed Python dependencies
        run: python -m pip_audit --skip-editable
      - name: Scan Python source for medium/high findings
        run: bandit -r src -q -ll

  web-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: src/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm build

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hardened images
        run: docker compose build api web
      - name: Verify non-root image users
        run: |
          test "$(docker image inspect crime-prediction-api --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect crime-prediction-web --format '{{.Config.User}}')" = "101:101"
      - name: Scan images for high and critical vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 crime-prediction-api
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 crime-prediction-web
