name: Person 1 platform

on:
  pull_request:
    paths:
      - "migrations/**"
      - "src/data/**"
      - "src/features/**"
      - "tests/data/**"
      - "tests/features/**"
      - "deploy/aws-vm/**"
      - "docker/postgres-init/**"
      - "docker-compose.yml"
      - ".github/workflows/person1-platform.yml"

jobs:
  platform-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_DB: crime_prediction
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crime_prediction"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[api,dev,model,platform]"
      - name: Create separate migrator and runtime roles
        env:
          ADMIN_DSN: postgresql://postgres:postgres-test-admin@localhost:5432/crime_prediction
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          with psycopg.connect(os.environ["ADMIN_DSN"], autocommit=True) as connection:
              connection.execute(
                  Path("docker/postgres-init/001-app-role.sql").read_text(encoding="utf-8")
              )
          PY
      - name: Run direct RLS and Person 1 tests
        env:
          TEST_POSTGRES_MIGRATOR_DSN: postgresql://crime_migrator:local-migrator-development-only@localhost:5432/crime_prediction
          TEST_POSTGRES_RUNTIME_DSN: postgresql://crime_app:local-runtime-development-only@localhost:5432/crime_prediction
        run: python -m pytest tests/data tests/features tests/contracts -q
